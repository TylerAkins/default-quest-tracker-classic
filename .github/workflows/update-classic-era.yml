name: Update Classic Era compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    concurrency:
      group: classic-era-update
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch current Classic Era build
        run: >-
          curl --fail --silent --show-error
          https://us.version.battle.net/v2/products/wow_classic_era/versions
          --output "${RUNNER_TEMP}/classic-era-versions"

      - name: Prepare compatibility release
        id: update
        run: |
          set -euo pipefail
          python3 tools/update_classic_era.py \
            --versions-file "${RUNNER_TEMP}/classic-era-versions"
          if git diff --quiet -- DefaultQuestTrackerClassic.toc VERSION CHANGELOG.md RELEASE_NOTES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "interface=$(sed -n 's/^## Interface: //p' DefaultQuestTrackerClassic.toc)" \
            >> "$GITHUB_OUTPUT"
          GAME_BUILD="$(PYTHONPATH=. python3 - "${RUNNER_TEMP}/classic-era-versions" <<'PY'
          import sys
          from pathlib import Path
          from tools.update_classic_era import parse_versions

          print(parse_versions(Path(sys.argv[1]).read_text(encoding="utf-8")).version)
          PY
          )"
          echo "game_build=${GAME_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Tests
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            PYTHONPATH=. python3 "$test_file"
          done

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: classic-era-build-update
          delete-branch: true
          commit-message: "chore: prepare v${{ steps.update.outputs.version }} for Classic Era"
          title: "chore: prepare v${{ steps.update.outputs.version }} for Classic Era ${{ steps.update.outputs.game_build }}"
          body: |
            Automated Classic Era compatibility update.

            - Game build: `${{ steps.update.outputs.game_build }}`
            - TOC Interface: `${{ steps.update.outputs.interface }}`
            - Addon version: `v${{ steps.update.outputs.version }}`

            Merging this reviewed PR creates the annotated version tag and publishes the GitHub release. CurseForge then packages the pushed tag through its GitHub webhook.
          add-paths: |
            DefaultQuestTrackerClassic.toc
            VERSION
            CHANGELOG.md
            RELEASE_NOTES.md

  publish-update:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'classic-era-build-update' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: classic-era-auto-release
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout merged update
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate prepared release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" HEAD -- DefaultQuestTrackerClassic.toc; then
            echo "Updater PR did not change the TOC interface" >&2
            exit 1
          fi
          VERSION="$(cat VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain exactly X.Y.Z" >&2
            exit 1
          fi
          grep -qF "## [${VERSION}]" CHANGELOG.md
          grep -qF "## [${VERSION}]" RELEASE_NOTES.md

      - name: Create tag and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v$(cat VERSION)"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
              echo "Existing ${RELEASE_TAG} is not an annotated tag" >&2
              exit 1
            fi
            EXISTING_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$EXISTING_SHA" != "$MERGE_SHA" ]]; then
              echo "Existing ${RELEASE_TAG} points to ${EXISTING_SHA}, not ${MERGE_SHA}" >&2
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$MERGE_SHA" -m "Release ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to dispatch."
          else
            gh workflow run release.yml --ref "$RELEASE_TAG"
          fi
