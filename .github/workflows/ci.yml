name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check TOC and tree
        run: |
          set -euo pipefail
          test -f DefaultQuestTrackerClassic.toc
          grep -qE '^## Interface:' DefaultQuestTrackerClassic.toc
          grep -qE '^## Version:' DefaultQuestTrackerClassic.toc
          if [ -d tools/.wowhead_cache ]; then
            echo "tools/.wowhead_cache must not be present in the repository"
            exit 1
          fi
          python3 tests/test_circle_textures.py
          python3 tests/test_wrap_at_spaces.py

      - name: Dry-run package
        uses: BigWigsMods/packager@v2
        with:
          # -d skips uploads; still builds the zip so .pkgmeta failures show up in CI
          args: -d
