name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check packaging metadata and tree
        run: |
          set -euo pipefail
          test -f DefaultQuestTrackerClassic.toc
          grep -qE '^## Interface:' DefaultQuestTrackerClassic.toc
          grep -qF '## Version: @project-version@' DefaultQuestTrackerClassic.toc
          test -f VERSION
          grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
          test -f tools/compile_addon.py
          test -f tools/update_classic_era.py
          test -f docs/DEVELOPMENT.md
          if [ -d tools/.wowhead_cache ]; then
            echo "tools/.wowhead_cache must not be present in the repository"
            exit 1
          fi

      - name: Python tests
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            PYTHONPATH=. python3 "$test_file"
          done

      - name: Dry-run package
        uses: BigWigsMods/packager@v2
        with:
          args: -d
